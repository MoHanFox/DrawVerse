language = "C"
cpp_compat = true
include_guard = "DRAWVERSE_PAINT_API_H"
autogen_warning = "/* Generated by pinned cbindgen. DO NOT EDIT. See contracts/abi.md. */"
header = "/* DrawVerse C ABI. Query paint_core_version and capabilities before use.\n * Initialize struct_size. All buffer lengths are bytes.\n * Model computation, lifecycle, and large pixel copies run off the UI thread.\n * Handles must never be dereferenced. Session submission/polling copies only bounded data.\n * Callbacks must not throw. See contracts/abi.md for ownership/thread/pointer contracts. */"
style = "both"
usize_is_size_t = false
documentation = true
sort_by = "Name"

[parse]
parse_deps = false

[export]
item_types = ["constants", "structs", "opaque", "typedefs", "functions"]
