[package]
name = "paint-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
paint-storage = { path = "../paint-storage" }
paint-core = { path = "../paint-core" }
paint-render = { path = "../paint-render" }
paint-task = { path = "../paint-task" }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "=0.37.5"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
brushkit-abr = "=0.7.3"

[lints]
workspace = true
